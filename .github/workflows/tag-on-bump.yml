name: tag-on-bump

# When a push to main changes cdk/package.json's "version", create and push a
# matching cdk-v<version> tag. That tag push is what drives publish.yml (npm
# release). Without this, a version bump can merge and sit unreleased — exactly
# how 0.3.0 stranded behind v0.2.2.
#
# The tag MUST be pushed with a PAT (secret RELEASE_TAG_PAT), not the default
# GITHUB_TOKEN: GitHub deliberately suppresses workflow triggers for refs pushed
# by GITHUB_TOKEN, so a token-pushed tag would never fire publish.yml.

on:
  push:
    branches: [main]
    paths:
      - "cdk/package.json"

concurrency:
  group: tag-on-bump
  cancel-in-progress: false

jobs:
  tag-on-bump:
    name: tag-on-bump
    runs-on: ubuntu-latest
    permissions:
      contents: read # tag push is authed via the PAT, not GITHUB_TOKEN
    steps:
      # fetch-depth 2 so HEAD~1 (the pre-merge parent) is available for the
      # version diff. Squash-merge to main means HEAD~1 is the correct "before".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.RELEASE_TAG_PAT }}

      - id: bump
        name: Detect version bump
        run: |
          new=$(node -p "require('./cdk/package.json').version")
          if git cat-file -e HEAD~1:cdk/package.json 2>/dev/null; then
            old=$(git show HEAD~1:cdk/package.json \
              | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          else
            old=""
          fi
          echo "old=$old new=$new"
          if [ "$old" = "$new" ]; then
            echo "version unchanged ($new) — nothing to tag."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$new" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.bump.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          tag="cdk-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin — skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release @horde.io/cdk $VERSION"
          git push origin "$tag"
          echo "Pushed $tag — publish.yml will release @horde.io/cdk@$VERSION."
