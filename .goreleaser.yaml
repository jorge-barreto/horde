# GoReleaser builds the horde CLI on a cli-v* tag: multi-OS/arch binaries, a
# GitHub Release with checksums, and a Homebrew formula. Version metadata is
# injected into the same main.* vars that `make build` sets.
version: 2

project_name: horde

# The CLI is tagged cli-v<semver> (cdk-v* tags belong to the npm package).
# GoReleaser (OSS) only auto-strips a leading "v", so for a cli-v0.1.0 tag
# {{ .Version }} would resolve to "cli-v0.1.0" — mis-stamping main.version and
# producing horde_cli-v0.1.0_* asset names. The Pro-only monorepo.tag_prefix
# would handle this, but it is NOT in the OSS schema (goreleaser check rejects
# it). Instead we strip the prefix with a template, {{ trimprefix .Version
# "cli-v" }}, everywhere the version is baked in (ldflags, archive name,
# release name) — yielding a clean 0.1.0 in the binary and asset names.
# OSS validate still rejects cli-v0.1.0 as non-semver, so the release workflow
# runs goreleaser with --skip=validate (see .github/workflows/release-cli.yml).

before:
  hooks:
    - go mod download

builds:
  - id: horde
    main: ./cmd/horde
    binary: horde
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ trimprefix .Version "cli-v" }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}

archives:
  - id: horde
    formats: [tar.gz]
    name_template: 'horde_{{ trimprefix .Version "cli-v" }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: jorge-barreto
    name: horde
  name_template: 'horde {{ trimprefix .Version "cli-v" }}'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - name: horde
    repository:
      owner: jorge-barreto
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_PAT }}"
    homepage: "https://github.com/jorge-barreto/horde"
    description: "Cloud launcher for orc workflows"
    license: "MIT"
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    test: |
      system "#{bin}/horde", "--version"
